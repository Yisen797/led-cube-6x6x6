; PlatformIO 工程配置 —— ESP32 DevKit V1（标准版，ESP32-WROOM-32）
; 编译：pio run          烧录：pio run -t upload
; 串口：pio device monitor -b 115200

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
